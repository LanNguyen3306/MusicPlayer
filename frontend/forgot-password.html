<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khôi phục - Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh; padding-bottom: 0;">
    <div class="card p-4 shadow-lg border-0" style="width: 400px; border-radius: 20px;">
        <h4 class="text-center text-warning fw-bold mb-4">🔐 Khôi phục mật khẩu</h4>
        <form id="form-otp">
            <input type="email" id="f-email" class="form-control py-2 mb-4 bg-light" placeholder="Nhập Email của bạn" required>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark rounded-pill">Nhận mã OTP</button>
            <div class="text-center mt-3"><a href="login.html" class="small text-muted text-decoration-none">← Về trang đăng nhập</a></div>
        </form>
        <form id="form-reset" class="d-none">
            <input type="text" id="r-otp" class="form-control py-2 mb-3 bg-light" placeholder="Nhập mã OTP 6 số" required>
            <input type="password" id="r-new-pass" class="form-control py-2 mb-4 bg-light" placeholder="Nhập mật khẩu mới" required>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill">Đổi mật khẩu</button>
        </form>
    </div>
    <script src="assets/api.js"></script>
    <script>
        let curEmail = "";
        document.getElementById('form-otp').addEventListener('submit', async (e) => {
            e.preventDefault();
            curEmail = document.getElementById('f-email').value;
            const res = await fetch(`${API_URL}/users/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: curEmail })
            });
            if (res.ok) {
                document.getElementById('form-otp').classList.add('d-none');
                document.getElementById('form-reset').classList.remove('d-none');
            } else alert("Lỗi gửi OTP.");
        });

        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                email: curEmail,
                otp: document.getElementById('r-otp').value,
                new_password: document.getElementById('r-new-pass').value
            };
            const res = await fetch(`${API_URL}/users/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                alert("Đổi thành công!");
                window.location.href = "login.html";
            } else alert("Mã OTP sai hoặc hết hạn.");
        });
    </script>
</body>
</html>
